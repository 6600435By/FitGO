[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && pnpm install && pnpm --filter @fitgo/shared-types build && pnpm --filter @fitgo/1c-adapter build && pnpm --filter @fitgo/osmi-adapter build && pnpm --filter @fitgo/api exec prisma generate && pnpm --filter @fitgo/api build"

[deploy]
startCommand = "cd ../.. && pnpm --filter @fitgo/api start"
healthcheckPath = "/api/features"
restartPolicyType = "ON_FAILURE"

[watch]
paths = ["apps/api/**", "packages/**", "pnpm-lock.yaml"]
